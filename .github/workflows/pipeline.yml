name: CI - API and UI Tests

on:
  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:
    inputs:
      browser:
        description: "Browser for UI tests"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: "8.0.x"
      BROWSER: ${{ github.event.inputs.browser || 'chrome' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore TestAutomationFramework/TestAutomationFramework.csproj

      - name: Build
        run: dotnet build TestAutomationFramework/TestAutomationFramework.csproj --no-restore

      - name: Run API tests
        run: |
          dotnet test TestAutomationFramework/TestAutomationFramework.csproj \
            --filter "Category=API" \
            --logger "trx;LogFileName=api-tests.trx" \
            --results-directory TestResults

      - name: Run UI tests
        if: always()
        run: |
          dotnet test TestAutomationFramework/TestAutomationFramework.csproj \
            --filter "Category=UI" \
            --logger "trx;LogFileName=ui-tests.trx" \
            --results-directory TestResults

      - name: Debug generated files
        if: always()
        run: |
          echo "=== TestResults ==="
          ls -R TestResults || true
          echo "=== Screenshots / Logs ==="
          ls -R TestAutomationFramework || true

      - name: Publish test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            TestResults/**
            TestAutomationFramework/**/Screenshots/**
            TestAutomationFramework/**/logs/**
